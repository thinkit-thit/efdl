# eFDL — site Nginx (__DOMAIN__ remplacé par install.sh).
# HTTPS : ajouté automatiquement par certbot (certificat Let's Encrypt, renouvelé seul).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/efdl-modern;
    index index.html;

    # Imports Excel, documents joints (10 Mo côté serveur) et photos
    client_max_body_size 12m;

    # Sécurité
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API : backend Spring Boot local
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Fichiers de l'application (noms avec empreinte : mis en cache longtemps)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application React : toute autre adresse renvoie index.html (jamais mis en cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
